<style>
:root, svg { --surface: #141414; --plot: #0a0a0a; --ink: #e5e5e5; --ink-2: #a3a3a3; --grid: #262626; --s1: #22d3ee; --s2: #eb6834; }
.bg { fill: var(--surface); } .plot { fill: var(--plot); stroke: var(--grid); }
.grid { stroke: var(--grid); stroke-width: 1; }
.gate { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.head { fill: var(--ink); font-size: 16px; font-weight: 600; }
.axis, .label { fill: var(--ink); font-size: 12px; }
.tick, .small, .note { fill: var(--ink-2); font-size: 11px; }
polyline { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ours-thin { stroke: var(--s1); stroke-width: 1.3; stroke-opacity: 0.4; }
.ours-med { stroke: var(--s1); stroke-width: 2.8; }
.ppo-thin { stroke: var(--s2); stroke-width: 1.3; stroke-opacity: 0.4; }
.ppo-med { stroke: var(--s2); stroke-width: 2.8; }
.ours-dot { fill: var(--s1); fill-opacity: 0.45; } .ppo-dot { fill: var(--s2); fill-opacity: 0.45; }
</style>
